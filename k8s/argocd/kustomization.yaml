apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - backend.yaml
  - nginx.yaml

images:
  - name: ghcr.io/jorikfon/jollykite/backend
    newTag: latest
  - name: ghcr.io/jorikfon/jollykite/nginx
    newTag: latest

# Hashed name: a change to nginx.conf rolls the nginx pod (subPath mounts never hot-reload).
# Before this the ConfigMap lived only in the cluster as an unmanaged `nginx-config`.
configMapGenerator:
  - name: nginx-config
    namespace: jollykite
    files:
      - nginx.conf
